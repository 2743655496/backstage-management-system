# ================================
# 0. 默认拒绝所有未知域名（防止 bedpage.com 跳转）
# ================================
server {
    listen 80 default_server;
    return 444;
}

# ================================
# 1. 本地 HTTPS（mkcert）
# ================================
server {
    listen 443 ssl http2;
    server_name localhost 127.0.0.1 192.168.10.143;

    # mkcert 证书（请确保文件名真实存在）
    ssl_certificate /etc/nginx/ssl/yourdomain+2.pem;
    ssl_certificate_key /etc/nginx/ssl/yourdomain+2-key.pem;

    # -------------------------
    # 前端静态资源（Vue dist）
    # -------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------
    # 后端 API
    # -------------------------
    location /api/ {
        proxy_pass http://backend:8000; #解析到 backend 容器的当前 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------
    # Django 静态文件
    # -------------------------
    location /static/ {
        alias /app/static/;
    }
}


