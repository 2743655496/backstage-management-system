services:
  mysql:
    image: mysql:8.0.36
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 111111
      MYSQL_DATABASE: backstage
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../back_stage_management_django
      dockerfile: ../docker_deploy/backend/Dockerfile
    container_name: backend
    env_file:
      - ../back_stage_management_django/.env.prod
    depends_on:
      - mysql
      - redis
    volumes:
      - backend_static:/app/static
    expose:
      - "8000"

  frontend:
    build:
      context: ../back-stage-management-front
      dockerfile: ../docker_deploy/frontend/Dockerfile
    container_name: frontend
    depends_on:
      - backend
    volumes:
      - frontend_dist:/dist

  nginx:
    image: nginx:1.25
    container_name: nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - frontend_dist:/usr/share/nginx/html
      - backend_static:/app/static

volumes:
  mysql_data:
  backend_static:
  frontend_dist:
