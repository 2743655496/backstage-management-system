version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: backend
    env_file:
      - ./backend/.env.prod
    volumes:
      - backend_static:/app/static
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - backend

  nginx:
    image: nginx:1.25
    container_name: nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - frontend_dist:/usr/share/nginx/html
      - backend_static:/app/static

volumes:
  backend_static:
  frontend_dist:
